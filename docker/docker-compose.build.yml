name: cryptfolio_build
services:
  cryptfolio:
    build: ../
    image: cryptfolio/cryptfolio:local
    extends:
      file: docker-compose.yml
      service: cryptfolio

  postgres:
    container_name: gf-postgres-build
    extends:
      file: docker-compose.yml
      service: postgres

  redis:
    container_name: gf-redis-build
    extends:
      file: docker-compose.yml
      service: redis

volumes:
  postgres:
